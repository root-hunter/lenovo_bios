name: Build bootable SREP USB image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional v* tag to create or update as a GitHub Release
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: srep-usb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EDK2_REF: edk2-stable202605
  EDK2_COMMIT: b03a21a63e3bd001f52c527e5a57feddb53a690b
  SREP_REF: 83d0ae47c9a48b3a2227aef06fb98a372c5ba354

jobs:
  build_usb_image:
    name: Build and verify USB image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Check out this repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install build and image tools
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail

          # Hosted runners also enable unrelated third-party repositories. This
          # build needs only Ubuntu packages; excluding the others prevents a
          # slow external mirror from blocking apt-get update indefinitely.
          disabled_sources="${RUNNER_TEMP}/disabled-apt-sources"
          mkdir -p "$disabled_sources"
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [[ -e "$source" ]] || continue
            case "$(basename "$source")" in
              ubuntu.sources|ubuntu.list) continue ;;
            esac
            sudo mv "$source" "$disabled_sources/"
          done

          sudo timeout --signal=TERM 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo timeout --signal=TERM 5m apt-get \
            -o Acquire::Retries=3 \
            --yes --no-install-recommends install \
            build-essential file gdisk git mtools nasm \
            python3 python3-setuptools uuid-dev xz-utils zip

      - name: Select artifact and release version
        id: version
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$GITHUB_REF_NAME
            release_tag=$GITHUB_REF_NAME
          elif [[ -n "$MANUAL_RELEASE_TAG" ]]; then
            version=$MANUAL_RELEASE_TAG
            release_tag=$MANUAL_RELEASE_TAG
          else
            version="run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          fi

          if [[ ! "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid artifact or release version: $version" >&2
            exit 1
          fi
          if [[ -n "$release_tag" && ! "$release_tag" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag must begin with v" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build, package, and verify the latest stable EDK II image
        env:
          ARTIFACT_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_srep_latest.sh "${RUNNER_TEMP}/srep-build" dist

      - name: Inspect release contents
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Select workflow artifact name
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: echo "name=lenovo-15arh05-srep-usb-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload verified workflow artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish_release:
    name: Publish GitHub Release
    needs: build_usb_image
    if: needs.build_usb_image.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified workflow artifact
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build_usb_image.outputs.artifact_name }}
          path: dist

      - name: Revalidate downloaded release files
        shell: bash
        run: (cd dist && sha256sum --check SHA256SUMS)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build_usb_image.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Lenovo BIOS Unlocker $RELEASE_TAG" \
              --generate-notes
          fi
